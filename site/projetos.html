<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfólio — Codora Tech</title>
<meta name="description" content="Conheça os projetos de software, sites, landing pages e identidade de marca desenvolvidos pela Codora Tech." />

<script>
  (function () {
    var stored = localStorage.getItem('codora-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = stored || (prefersDark ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.classList.add('dark');
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {
    fontFamily: { display: ['"Space Grotesk"', 'sans-serif'], body: ['Inter', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] }
  } } };
</script>

<style>
  :root {
    --bg: #ffffff; --bg-elevated: #ffffff; --bg-subtle: #f7f6fa;
    --text-primary: #16121f; --text-secondary: #55506a; --text-muted: #8b869f;
    --border: #e7e4ee; --primary: #420f74; --primary-2: #6a21ab;
    --secondary: #fb8500; --secondary-2: #ffa733; --grid-line: rgba(66,15,116,0.06);
  }
  html.dark {
    --bg: #08070c; --bg-elevated: #100d18; --bg-subtle: #0d0b13;
    --text-primary: #f3f1f8; --text-secondary: #b6b0c9; --text-muted: #746e8c;
    --border: #221d30; --primary: #9b5de5; --primary-2: #7c2fd1;
    --secondary: #ffb347; --secondary-2: #fb8500; --grid-line: rgba(155,93,229,0.08);
  }
  * { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  body { background: var(--bg); color: var(--text-primary); font-family: 'Inter', sans-serif; transition: background-color .4s ease, color .4s ease; }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .text-primary-c { color: var(--text-primary); } .text-secondary-c { color: var(--text-secondary); } .text-muted-c { color: var(--text-muted); }
  .bg-surface { background: var(--bg); } .bg-elevated { background: var(--bg-elevated); } .bg-subtle { background: var(--bg-subtle); }
  .border-c { border-color: var(--border); }
  .brand-grad-text { background: linear-gradient(120deg, var(--primary) 0%, var(--secondary) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%); color: #fff; box-shadow: 0 8px 24px -8px rgba(66,15,116,.5); transition: transform .25s ease, box-shadow .25s ease; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 32px -8px rgba(66,15,116,.6); }
  .btn-ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border); transition: all .25s ease; }
  .btn-ghost:hover { border-color: var(--primary); background: var(--bg-subtle); }
  .card { background: var(--bg-elevated); border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(20,10,40,.03), 0 12px 32px -16px rgba(20,10,40,.12); transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, border-color .3s ease; }
  html.dark .card { box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 12px 32px -16px rgba(0,0,0,.5); }
  .card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
  #site-nav { backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid var(--border); }
  .theme-toggle { position: relative; width: 52px; height: 28px; border-radius: 999px; background: var(--bg-subtle); border: 1px solid var(--border); cursor: pointer; }
  .theme-toggle .knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 999px; background: linear-gradient(135deg, var(--primary), var(--secondary)); transition: transform .35s cubic-bezier(.2,.9,.3,1.3); display:flex; align-items:center; justify-content:center; }
  html.dark .theme-toggle .knob { transform: translateX(24px); }
  .theme-toggle svg { width: 13px; height: 13px; color: white; }
  .grid-fade { background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, black 40%, transparent 85%); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
  .reveal.in-view { opacity: 1; transform: translateY(0); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--secondary); outline-offset: 3px; border-radius: 4px; }
  .skip-link { position: absolute; left: -9999px; top: 0; background: var(--primary); color: #fff; padding: 12px 20px; z-index: 100; border-radius: 0 0 8px 0; }
  .skip-link:focus { left: 0; }
  .portfolio-filter-btn[aria-pressed="true"] { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; }
  .flag-badge { font-size: 15px; line-height: 1; }
  .lang-select-btn[aria-pressed="true"] { background: var(--bg-subtle); border-color: var(--primary); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(8,7,12,.6); backdrop-filter: blur(4px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-box { position: fixed; inset: 0; margin: auto; max-width: 640px; max-height: 85vh; overflow-y: auto; z-index: 91; opacity: 0; transform: translateY(16px) scale(.98); pointer-events: none; transition: all .3s cubic-bezier(.2,.8,.2,1); }
  .modal-box.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
</style>
</head>

    <a href="codora-tech-landing.html" class="flex items-center gap-2.5 font-display font-semibold text-lg shrink-0">

          <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.6A9 9 0 1111.4 3a7 7 0 009.6 9.6z"/></svg>
        </span>
      </button>
    </div>
  </nav>
</header>

<main id="main-content">
<section class="relative pt-40 pb-16 overflow-hidden">
  <div class="absolute inset-0 grid-fade" aria-hidden="true"></div>
  <div class="relative max-w-4xl mx-auto px-5 text-center">
    <p class="font-mono text-xs text-[var(--secondary)] mb-3 tracking-wide reveal in-view" data-i18n="pfEyebrow">// Portfólio completo</p>

    <p class="text-secondary-c leading-relaxed max-w-xl mx-auto reveal in-view" style="transition-delay:.1s" data-i18n="pfSub">Cada projeto nasce de um problema real — conheça alguns dos trabalhos que desenvolvemos para nossos clientes.</p>

<section class="pb-28 max-w-7xl mx-auto px-5 md:px-8">
  <div class="flex flex-wrap gap-2 justify-center mb-12" role="group" aria-label="Filtrar por categoria">
    <button type="button" class="portfolio-filter-btn text-sm font-medium px-4 py-2 rounded-full border border-c" data-filter="all" aria-pressed="true" data-i18n="filterAll">Todos</button>

    <button type="button" class="portfolio-filter-btn text-sm font-medium px-4 py-2 rounded-full border border-c" data-filter="sistema" aria-pressed="false" data-i18n="filterSystems">Sistemas</button>
    <button type="button" class="portfolio-filter-btn text-sm font-medium px-4 py-2 rounded-full border border-c" data-filter="landing" aria-pressed="false" data-i18n="filterLanding">Landing Pages</button>
    <button type="button" class="portfolio-filter-btn text-sm font-medium px-4 py-2 rounded-full border border-c" data-filter="marca" aria-pressed="false" data-i18n="filterBrand">Identidade de Marca</button>
    <button type="button" class="portfolio-filter-btn text-sm font-medium px-4 py-2 rounded-full border border-c" data-filter="design" aria-pressed="false" data-i18n="filterDesign">Design</button>

<footer class="border-t border-c bg-subtle">

    <a href="codora-tech-landing.html#quote-form" class="btn-primary rounded-full px-6 py-3 text-sm font-semibold" data-i18n="footerCta">Pedir Orçamento</a>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay" tabindex="-1"></div>
<div id="modal-box" class="modal-box card rounded-2xl m-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal-cover" class="h-48 rounded-t-2xl"></div>
  <div class="p-7">
    <div class="flex items-start justify-between gap-4 mb-3">
      <div>
        <p id="modal-cat" class="text-xs font-mono text-[var(--secondary)] mb-1"></p>
        <h2 id="modal-title" class="font-display font-semibold text-xl"></h2>
      </div>
      <button type="button" id="modal-close" class="w-8 h-8 rounded-full border border-c flex items-center justify-center shrink-0" aria-label="Fechar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p id="modal-desc" class="text-sm text-secondary-c leading-relaxed mb-5"></p>
    <div id="modal-tech" class="flex flex-wrap gap-2"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var dict = {
    pt: {
      skipLink: "Pular para o conteúdo", backHome: "Voltar para o site",
      pfEyebrow: "// Portfólio completo", pfTitle: "Projetos que já entregamos",
      pfSub: "Cada projeto nasce de um problema real — conheça alguns dos trabalhos que desenvolvemos para nossos clientes.",
      filterAll: "Todos", filterSites: "Sites", filterSystems: "Sistemas", filterLanding: "Landing Pages", filterBrand: "Identidade de Marca", filterDesign: "Design",
      footerRights: "Todos os direitos reservados.", footerCta: "Pedir Orçamento",
      viewDetails: "Ver detalhes",
      p1n: "Golden Jardim", p1c: "site", p1cl: "Sites", p1d: "Site institucional para estúdio de paisagismo, com galeria de portfólio e formulário de orçamento integrado.",
      p2n: "Gestão Financeira", p2c: "sistema", p2cl: "Sistemas", p2d: "Plataforma de controle financeiro para pequenas empresas, com relatórios automáticos e dashboards.",
      p3n: "Página de Conversão", p3c: "landing", p3cl: "Landing Pages", p3d: "Landing page de alta conversão para campanha de lançamento de produto.",
      p4n: "Identidade Visual — Rede de Clínicas", p4c: "marca", p4cl: "Identidade de Marca", p4d: "Rebranding completo com novo logotipo, paleta de cores e diretrizes de aplicação.",
      p5n: "Site Corporativo", p5c: "site", p5cl: "Sites", p5d: "Presença digital completa para distribuidora regional, com catálogo de produtos.",
      p6n: "Fluxo de Pedidos", p6c: "sistema", p6cl: "Sistemas", p6d: "Automação do processo de pedidos e controle de estoque em tempo real.",
      p7n: "Landing de Evento", p7c: "landing", p7cl: "Landing Pages", p7d: "Página de inscrição para evento corporativo, com contagem regressiva e formulário.",
      p8n: "Design de App Mobile", p8c: "design", p8cl: "Design", p8d: "Interface de aplicativo mobile para agendamento de serviços.",
      p9n: "Identidade — Estúdio Criativo", p9c: "marca", p9cl: "Identidade de Marca", p9d: "Construção de marca do zero para estúdio de design independente."
    },
    en: {
      skipLink: "Skip to content", backHome: "Back to site",
      pfEyebrow: "// Full portfolio", pfTitle: "Projects we've delivered",
      pfSub: "Every project starts from a real problem — take a look at some of the work we've done for our clients.",
      filterAll: "All", filterSites: "Websites", filterSystems: "Systems", filterLanding: "Landing Pages", filterBrand: "Brand Identity", filterDesign: "Design",
      footerRights: "All rights reserved.", footerCta: "Request a Quote",
      viewDetails: "View details",
      p1n: "Golden Jardim", p1c: "site", p1cl: "Websites", p1d: "Institutional website for a landscaping studio, with a portfolio gallery and an integrated quote form.",
      p2n: "Financial Management", p2c: "sistema", p2cl: "Systems", p2d: "Financial control platform for small businesses, with automated reports and dashboards.",
      p3n: "Conversion Page", p3c: "landing", p3cl: "Landing Pages", p3d: "High-conversion landing page for a product launch campaign.",
      p4n: "Visual Identity — Clinic Network", p4c: "marca", p4cl: "Brand Identity", p4d: "Full rebrand with a new logo, color palette and usage guidelines.",
      p5n: "Corporate Website", p5c: "site", p5cl: "Websites", p5d: "Full digital presence for a regional distributor, with a product catalog.",
      p6n: "Order Workflow", p6c: "sistema", p6cl: "Systems", p6d: "Automation of the order process and real-time inventory control.",
      p7n: "Event Landing Page", p7c: "landing", p7cl: "Landing Pages", p7d: "Registration page for a corporate event, with countdown and signup form.",
      p8n: "Mobile App Design", p8c: "design", p8cl: "Design", p8d: "Mobile app interface for service scheduling.",
      p9n: "Identity — Creative Studio", p9c: "marca", p9cl: "Brand Identity", p9d: "Brand built from the ground up for an independent design studio."
    }
  };

  var gradients = [
    'linear-gradient(135deg, var(--primary), #7c2fd1)',
    'linear-gradient(135deg, #1e1730, #420f74)',
    'linear-gradient(135deg, var(--secondary), #ffcc80)',
    'linear-gradient(135deg, #420f74, var(--secondary))',
    'linear-gradient(135deg, #2a1b47, #6a21ab)',
    'linear-gradient(135deg, #fb8500, #420f74)',
    'linear-gradient(135deg, #6a21ab, #ffb347)',
    'linear-gradient(135deg, #16121f, #420f74)',
    'linear-gradient(135deg, #fb8500, #6a21ab)'
  ];
  var techByCat = {
    site: ['Next.js', 'Tailwind CSS', 'SEO Local'],
    sistema: ['Next.js', 'PostgreSQL', 'Prisma'],
    landing: ['React', 'Framer Motion', 'CRO'],
    marca: ['Figma', 'Brand Guidelines'],
    design: ['Figma', 'Design System']
  };

  var projects = [1,2,3,4,5,6,7,8,9].map(function (i) { return 'p' + i; });

  function buildGrid(lang) {
    var grid = document.getElementById('portfolio-grid');
    grid.innerHTML = '';
    projects.forEach(function (key, idx) {
      var d = dict[lang];
      var name = d[key + 'n'], cat = d[key + 'c'], catLabel = d[key + 'cl'], desc = d[key + 'd'];
      var article = document.createElement('article');
      article.className = 'reveal portfolio-item card rounded-2xl overflow-hidden group cursor-pointer';
      article.setAttribute('data-category', cat);
      article.setAttribute('tabindex', '0');
      article.setAttribute('role', 'button');
      article.setAttribute('aria-label', name + ' — ' + d.viewDetails);
      article.style.transitionDelay = (idx % 3) * 0.05 + 's';
      article.innerHTML =
        '<div class="h-44 relative overflow-hidden" style="background:' + gradients[idx] + '">' +
          '<div class="absolute inset-0 flex items-center justify-center font-display font-semibold text-white/90 text-sm tracking-wide text-center px-4 transition-transform duration-500 group-hover:scale-110">' + name + '</div>' +
        '</div>' +
        '<div class="p-5">' +
          '<p class="text-xs font-mono text-[var(--secondary)] mb-1">' + catLabel + '</p>' +
          '<h3 class="font-display font-semibold mb-1">' + name + '</h3>' +
          '<p class="text-sm text-muted-c mb-4">' + desc + '</p>' +
          '<span class="text-sm font-medium text-[var(--primary)]">' + d.viewDetails + ' →</span>' +
        '</div>';
      article.addEventListener('click', function () { openModal(key, idx, lang); });
      article.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(key, idx, lang); } });
      grid.appendChild(article);
    });
    var ro = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (entry) { if (entry.isIntersecting) { entry.target.classList.add('in-view'); obs.unobserve(entry.target); } });
    }, { threshold: 0.12 });
    grid.querySelectorAll('.reveal').forEach(function (el) { ro.observe(el); });
    applyActiveFilter();
  }

  var overlay = document.getElementById('modal-overlay');
  var modal = document.getElementById('modal-box');
  var modalCover = document.getElementById('modal-cover');
  var modalCat = document.getElementById('modal-cat');
  var modalTitle = document.getElementById('modal-title');
  var modalDesc = document.getElementById('modal-desc');
  var modalTech = document.getElementById('modal-tech');
  var lastFocused = null;

  function openModal(key, idx, lang) {
    var d = dict[lang];
    lastFocused = document.activeElement;
    modalCover.style.background = gradients[idx];
    modalCat.textContent = d[key + 'cl'];
    modalTitle.textContent = d[key + 'n'];
    modalDesc.textContent = d[key + 'd'];
    var tech = techByCat[d[key + 'c']] || [];
    modalTech.innerHTML = tech.map(function (t) { return '<span class="text-xs font-mono px-3 py-1 rounded-full border border-c">' + t + '</span>'; }).join('');
    overlay.classList.add('open');
    modal.classList.add('open');
    document.getElementById('modal-close').focus();
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    overlay.classList.remove('open');
    modal.classList.remove('open');
    document.body.style.overflow = '';
    if (lastFocused) lastFocused.focus();
  }
  overlay.addEventListener('click', closeModal);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  var currentFilter = 'all';
  function applyActiveFilter() {
    document.querySelectorAll('.portfolio-item').forEach(function (item) {
      var show = currentFilter === 'all' || item.getAttribute('data-category') === currentFilter;
      item.style.display = show ? '' : 'none';
    });
  }
  document.querySelectorAll('.portfolio-filter-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.portfolio-filter-btn').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
      btn.setAttribute('aria-pressed', 'true');
      currentFilter = btn.getAttribute('data-filter');
      applyActiveFilter();
    });
  });

  function applyLang(lang) {
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en-US';
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (dict[lang][key] !== undefined) el.textContent = dict[lang][key];
    });
    document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang-btn') === lang ? 'true' : 'false');
    });
    localStorage.setItem('codora-lang', lang);
    buildGrid(lang);
  }

  var savedLang = localStorage.getItem('codora-lang') || (navigator.language && navigator.language.toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en');
  applyLang(savedLang);
  document.querySelectorAll('[data-lang-btn]').forEach(function (btn) {
    btn.addEventListener('click', function () { applyLang(btn.getAttribute('data-lang-btn')); });
  });

  var themeBtn = document.getElementById('theme-toggle');
  var sunIcon = document.getElementById('theme-icon-sun');
  var moonIcon = document.getElementById('theme-icon-moon');
  function setThemeIcons() {
    var isDark = document.documentElement.classList.contains('dark');
    sunIcon.classList.toggle('hidden', !isDark);
    moonIcon.classList.toggle('hidden', isDark);
  }
  setThemeIcons();
  themeBtn.addEventListener('click', function () {
    var isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('codora-theme', isDark ? 'dark' : 'light');
    setThemeIcons();
  });
})();
</script>
</body>
</html>
